<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Pulse | Contact</title>
    <meta name="description" content="Shop premium gym and strength equipment at Iron Pulse. Discover dumbbells, barbells, benches, power racks, kettlebells and more.">

    <!-- Open Graph -->
    <meta property="og:title" content="Iron Pulse | Contact">
    <meta property="og:description" content="Shop premium gym and strength equipment at Iron Pulse. Discover dumbbells, barbells, benches, power racks, kettlebells and more.">
    <meta property="og:image" content="media/images/Hero_Banner.png">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
    <script src="js/analytics.js" defer></script>
</head>

<body>
    <!-- Header & Navigation -->
    <header>
        <div class="logo">
            <img src="media/icons/IP_logo.png" alt="IRON PULSE logo">
            <span class="logo-text">IRON<span class="accent">PULSE</span></span>
        </div>
        <div class="burger" id="burger">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
        <nav>
            <ul id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html">🛒Cart</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Hero -->
        <section class="contact-hero">
            <h1>Contact Us</h1>
            <p>Questions about a product or an order? Get in touch.</p>
        </section>

        <!-- Contact Form -->
        <section class="contact-content">
            <form id="contact-form" novalidate>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
                <span class="error-message" id="name-error"></span>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message" id="email-error"></span>

                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>
                <span class="error-message" id="subject-error"></span>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
                <span class="error-message" id="message-error"></span>

                <button type="submit" class="btn">Send Message</button>
                <p id="form-success" class="success-message"></p>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Iron Pulse. All rights reserved.</p>
        <p id="visit-counter" class="visit-counter"></p>
    </footer>

    <script src="js/contact.js"></script>
</body>
</html>
